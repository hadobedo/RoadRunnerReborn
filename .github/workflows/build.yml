name: Build

on:
  push:
    branches:
      - development
      - main
    paths:
      - '**/*.h'
      - '**/*.m'
      - '**/*.xm'
      - '**/*.plist'
      - '**/Makefile'
      - 'control'
      - 'layout/**'
      - 'vendor/**'
      - 'scripts/**'
      - '.github/RELEASE_NOTES.md'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '**/*.h'
      - '**/*.m'
      - '**/*.xm'
      - '**/*.plist'
      - '**/Makefile'
      - 'control'
      - 'layout/**'
      - 'vendor/**'
      - 'scripts/**'
      - '.github/RELEASE_NOTES.md'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          count=$(awk '$1 == "Version:" { count++ } END { print count + 0 }' control)
          version=$(awk '$1 == "Version:" && NF == 2 { print $2 }' control)
          test "$count" -eq 1
          test -n "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build-package.yml
    with:
      package_version: ${{ needs.version.outputs.version }}
